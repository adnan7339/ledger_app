name: Android CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # 1. Repository Checkout (v4)
    - name: Checkout repository
      uses: actions/checkout@v4

    # 2. Setup Java JDK (Updated version & Node compatibility)
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    # 3. Grant execute permissions for Gradle wrapper
    # Note: Agar aapka android project kisi subfolder mein hai, toh niche wali line se '#' hata kar path likhein
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
      # working-directory: ./your-subfolder-name

    # 4. Build APK / App Bundle
    - name: Build with Gradle
      run: ./gradlew build
      # working-directory: ./your-subfolder-name
